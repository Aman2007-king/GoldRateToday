<div class="card">
    <h2>Currency Converter</h2>
    <input type="number" id="amount" value="1" oninput="convert()">
    <select id="from" onchange="convert()">
        <option value="USD">USD - US Dollar</option>
        <option value="INR" selected>INR - Indian Rupee</option>
    </select>
    <span> to </span>
    <select id="to" onchange="convert()">
        <option value="INR">INR - Indian Rupee</option>
        <option value="USD" selected>USD - US Dollar</option>
    </select>
    <h3 id="result">Calculating...</h3>
</div>

<script>
    async function convert() {
        const amount = document.getElementById('amount').value;
        const from = document.getElementById('from').value;
        const to = document.getElementById('to').value;
        
        // Using a free exchange rate API
        const res = await fetch(`https://api.exchangerate-api.com/v4/latest/${from}`);
        const data = await res.json();
        const rate = data.rates[to];
        const final = (amount * rate).toFixed(2);
        
        document.getElementById('result').innerText = `${amount} ${from} = ${final} ${to}`;
    }
    convert();
</script>

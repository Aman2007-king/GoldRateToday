<!DOCTYPE html>
<html>
<head>
    <title>Nifty 50 Live Chart & Levels</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f7f6; }
        nav { background: #2c3e50; padding: 15px; text-align: center; }
        nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; }
        .container { max-width: 1000px; margin: 20px auto; background: white; padding: 20px; }
    </style>
</head>
<body>
    <div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>
  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
  {
  "symbols": [
    { "proName": "FOREXCOM:XAUUSD", "title": "Gold" },
    { "proName": "FOREXCOM:XAGUSD", "title": "Silver" },
    { "proName": "BSE:SENSEX", "title": "SENSEX" },
    { "proName": "NSE:NIFTY", "title": "NIFTY 50" },
    { "proName": "FX_IDC:USDINR", "title": "USD to INR" },
    { "proName": "MCX:CRUDEOIL1!", "title": "Crude Oil" }
  ],
  "showSymbolLogo": true,
  "colorTheme": "light",
  "isTransparent": false,
  "displayMode": "adaptive",
  "locale": "in"
}
  </script>
</div>
<style>
    /* Ensures the ticker doesn't hide behind your navbar */
    .tradingview-widget-container {
        position: sticky;
        top: 0;
        z-index: 999;
        margin-bottom: 0px;
    }
</style>
    <nav>
        <a href="/">Gold</a>
        <a href="/silver">Silver</a>
        <a href="/nifty" style="color: #f1c40f;">NIFTY 50</a>
        <a href="/crude-oil">Crude Oil</a>
    </nav>

    <div class="container">
        <h1>Nifty 50 Live Market</h1>
        <div class="tradingview-widget-container">
            <div id="tradingview_nifty"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
            <script type="text/javascript">
            new TradingView.widget({
                "width": "100%",
                "height": 500,
                "symbol": "NSE:NIFTY",
                "interval": "D",
                "timezone": "Asia/Kolkata",
                "theme": "light",
                "style": "1",
                "locale": "in",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "container_id": "tradingview_nifty"
            });
            </script>
        </div>
    </div>
</body>
</html>

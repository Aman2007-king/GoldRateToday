<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Calculator Hub | India Wealth Hub</title>
    <style>
        :root { --primary: #0c2461; --accent: #f1c40f; --text: #2d3748; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: var(--text); }
        .hub-wrapper { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 300px 1fr; gap: 25px; }
        
        /* Sidebar Navigation */
        .sidebar { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); position: sticky; top: 20px; height: 85vh; overflow-y: auto; }
        .sidebar h3 { color: var(--primary); font-size: 1.2rem; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        .nav-btn { width: 100%; text-align: left; padding: 12px; margin: 4px 0; border: none; background: none; border-radius: 8px; cursor: pointer; font-weight: 500; color: #4a5568; transition: 0.2s; }
        .nav-btn:hover { background: #f1f5f9; color: var(--primary); }
        .nav-btn.active { background: var(--primary); color: white; }

        /* Calculator Display */
        .main-calc { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        .input-group input { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        
        .result-box { background: #f8fafc; padding: 30px; border-radius: 12px; border-left: 6px solid var(--primary); }
        .result-box h3 { margin-top: 0; color: var(--primary); }
        .res-val { font-size: 1.5rem; font-weight: 800; color: #1a202c; }

        @media (max-width: 850px) { .hub-wrapper { grid-template-columns: 1fr; } .sidebar { position: static; height: auto; } .input-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="hub-wrapper">
    <aside class="sidebar">
        <h3>Calculators</h3>
        <div id="nav-list"></div>
    </aside>

    <main class="main-calc">
        <h2 id="calc-title" style="color: var(--primary); margin-top: 0;">Select a Calculator</h2>
        <div class="input-grid" id="input-area"></div>
        <div class="result-box" id="result-area">
            <h3>Calculated Result</h3>
            <div class="res-val" id="res-total">₹ 0</div>
            <p id="res-detail" style="color: #718096; margin-top: 10px;"></p>
        </div>
    </main>
</div>

<script>
    const calcs = {
        sip: { title: "SIP Calculator", fields: {p:"Monthly SIP (₹)", r:"Return Rate (%)", n:"Years"}, val: [5000, 12, 10], 
            fn: (v) => { let i=v.r/1200; let m=v.n*12; let f=v.p*((Math.pow(1+i, m)-1)/i)*(1+i); return [f, `Invested: ₹${(v.p*m).toLocaleString()}`]; } },
        
        stepup: { title: "Step-Up SIP", fields: {p:"Initial SIP (₹)", s:"Annual Step-up (%)", r:"Returns (%)", n:"Years"}, val: [5000, 10, 12, 10],
            fn: (v) => { let f=0; let p=v.p; let inv=0; for(let j=0; j<v.n; j++){ let i=v.r/1200; let yf=p*((Math.pow(1+i, 12)-1)/i)*(1+i); f=(f*Math.pow(1+v.r/100, 1))+yf; inv+=(p*12); p*=(1+v.s/100); } return [f, `Total Invested: ₹${inv.toLocaleString()}`]; } },
        
        emi: { title: "EMI Calculator", fields: {p:"Loan Amount (₹)", r:"Interest Rate (%)", n:"Tenure (Years)"}, val: [1000000, 8.5, 20],
            fn: (v) => { let r=v.r/1200; let n=v.n*12; let e=(v.p*r*Math.pow(1+r,n))/(Math.pow(1+r,n)-1); return [e, `Monthly EMI. Total Interest: ₹${Math.round(e*n - v.p).toLocaleString()}`]; } },
        
        ssy: { title: "SSY (Sukanya Samriddhi)", fields: {p:"Annual Deposit (₹)", age:"Child Age"}, val: [150000, 1],
            fn: (v) => { let r=8.2; let b=0; for(let i=1; i<=21; i++){ if(i<=15) b+=v.p; b*=(1+r/100); } return [b, `Maturity after 21 years (8.2% Rate)`]; } },
        
        ppf: { title: "PPF Calculator", fields: {p:"Annual Deposit (₹)", n:"Years (Min 15)"}, val: [150000, 15],
            fn: (v) => { let r=7.1/100; let f=v.p*((Math.pow(1+r, v.n)-1)/r)*(1+r); return [f, `Current Rate: 7.1%`]; } },

        fd: { title: "FD Calculator", fields: {p:"Principal (₹)", r:"Rate (%)", n:"Years"}, val: [100000, 7, 5],
            fn: (v) => { let f=v.p*Math.pow(1+v.r/100, v.n); return [f, `Total Interest: ₹${Math.round(f-v.p).toLocaleString()}`]; } },

        rd: { title: "RD Calculator", fields: {p:"Monthly Deposit (₹)", r:"Rate (%)", n:"Years"}, val: [5000, 7, 2],
            fn: (v) => { let n=v.n*12; let r=v.r/400; let f=0; for(let i=1; i<=n; i++){ f += v.p * Math.pow(1+r, 4*(n-i+1)/12); } return [f, `Invested: ₹${(v.p*n).toLocaleString()}`]; } },

        salary: { title: "Income Tax (New Regime 26)", fields: {s:"Annual Salary (₹)"}, val: [1500000],
            fn: (v) => { let t=v.s-75000; let tax=0; if(t>400000) tax+=Math.min(400000, t-400000)*0.05; if(t>800000) tax+=Math.min(400000, t-800000)*0.10; if(t>1200000) tax+=Math.min(400000, t-1200000)*0.15; if(t>1600000) tax+=Math.min(400000, t-1600000)*0.20; if(t>2000000) tax+=Math.min(400000, t-2000000)*0.25; if(t>2400000) tax+=(t-2400000)*0.30; return [tax*1.04, `Annual Tax (Incl. 4% Cess)`]; } },

        gst: { title: "GST Calculator", fields: {p:"Amount (₹)", r:"GST %"}, val: [10000, 18],
            fn: (v) => { let g=(v.p*v.r)/100; return [v.p+g, `GST Amount: ₹${g.toLocaleString()}`]; } },

        epf: { title: "EPF Calculator", fields: {b:"Monthly Basic + DA (₹)", age:"Current Age"}, val: [30000, 25],
            fn: (v) => { let r=8.15/100; let m=12*(58-v.age); let p=v.b*0.12 + v.b*0.0367; let f=p*((Math.pow(1+r/12, m)-1)/(r/12)); return [f, `Estimated Corpus at Retirement (8.15%)`]; } },

        brokerage: { title: "Brokerage (Angel One)", fields: {v:"Trade Value (₹)", t:"Type (1:Del, 2:Intra)"}, val: [100000, 1],
            fn: (v) => { let b=(v.t==1)? 0 : Math.min(20, v.v*0.0003); return [b, `Estimated Brokerage Charge`]; } },

        stockavg: { title: "Stock Average", fields: {p1:"Price 1", q1:"Qty 1", p2:"Price 2", q2:"Qty 2"}, val: [500, 10, 450, 10],
            fn: (v) => { let avg=(v.p1*v.q1 + v.p2*v.q2)/(v.q1+v.q2); return [avg, `Total Qty: ${v.q1+v.q2}`]; } },

        margin: { title: "Margin Calculator", fields: {v:"Total Value (₹)", m:"Leverage (X)"}, val: [100000, 5],
            fn: (v) => { return [v.v/v.m, `Required Margin for Trade`]; } },

        tds: { title: "TDS Calculator", fields: {p:"Total Payment (₹)", r:"TDS %"}, val: [50000, 10],
            fn: (v) => { return [(v.p*v.r)/100, `TDS to be Deducted`]; } },

        swp: { title: "SWP Calculator", fields: {p:"Total Investment (₹)", w:"Monthly Withdrawal", r:"Return %", n:"Years"}, val: [1000000, 10000, 10, 10],
            fn: (v) => { let b=v.p; let ir=v.r/1200; for(let i=0; i<v.n*12; i++){ b = (b-v.w)*(1+ir); } return [b, `Remaining Balance after Tenure`]; } },

        mf: { title: "Mutual Fund Returns", fields: {p:"Lump sum (₹)", r:"Rate (%)", n:"Years"}, val: [100000, 15, 10],
            fn: (v) => { let f=v.p*Math.pow(1+v.r/100, v.n); return [f, `Wealth Gained: ₹${Math.round(f-v.p).toLocaleString()}`]; } }
    };

    function init() {
        const nav = document.getElementById('nav-list');
        Object.keys(calcs).forEach(k => {
            let b = document.createElement('button');
            b.className = 'nav-btn'; b.innerText = calcs[k].title;
            b.onclick = () => loadCalc(k);
            b.id = 'btn-'+k; nav.appendChild(b);
        });
        loadCalc('sip');
    }

    function loadCalc(key) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-'+key).classList.add('active');
        const c = calcs[key];
        document.getElementById('calc-title').innerText = c.title;
        let html = '';
        Object.keys(c.fields).forEach((f, i) => {
            html += `<div class="input-group"><label>${c.fields[f]}</label>
                     <input type="number" id="in-${f}" value="${c.val[i]}" oninput="run('${key}')"></div>`;
        });
        document.getElementById('input-area').innerHTML = html;
        run(key);
    }

    function run(key) {
        const c = calcs[key];
        let v = {};
        Object.keys(c.fields).forEach(f => v[f] = parseFloat(document.getElementById('in-'+f).value) || 0);
        const [res, detail] = c.fn(v);
        document.getElementById('res-total').innerText = "₹ " + Math.round(res).toLocaleString('en-IN');
        document.getElementById('res-detail').innerText = detail;
    }

    init();
</script>
</body>
</html>
